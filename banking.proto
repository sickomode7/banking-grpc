syntax = "proto3";

package banking;

// =============================================================
//  Account Management Service
//  Owns the balance data. Runs on its own port (50051).
// =============================================================
service AccountService {
  // Read the current balance for one account.
  rpc GetBalance (BalanceRequest) returns (BalanceResponse);

  // Apply a signed delta to a balance (positive = credit, negative = debit).
  // Mirrors the "updateBalance" method from the assignment.
  rpc UpdateBalance (UpdateBalanceRequest) returns (BalanceResponse);
}

message BalanceRequest {
  string user_id = 1;
}

message BalanceResponse {
  string user_id  = 1;
  double balance  = 2;
  string currency = 3;
}

message UpdateBalanceRequest {
  string user_id = 1;
  double amount  = 2; // signed: -50.00 debits, +50.00 credits
  string reason  = 3; // audit label: "transfer-out", "transfer-in", "rollback"
}

// =============================================================
//  Transaction Service
//  Owns transfer orchestration + history. Runs on port 50052
//  and calls the Account Service over gRPC (service-to-service).
// =============================================================
service TransactionService {
  rpc InitiateTransfer (TransferRequest) returns (TransferResponse);

  rpc GetTransactionHistory (HistoryRequest) returns (HistoryResponse);
}

message TransferRequest {
  string from_user_id = 1;
  string to_user_id   = 2;
  double amount       = 3;
  string note         = 4;
}

message TransferResponse {
  string transaction_id    = 1;
  string status            = 2; // "COMPLETED"
  double from_new_balance  = 3;
  double to_new_balance    = 4;
}

message HistoryRequest {
  string user_id = 1;
  int32  limit   = 2; // 0 = server default
}

message TransactionRecord {
  string transaction_id = 1;
  string counterparty   = 2;
  string direction      = 3; // "IN" | "OUT"
  double amount         = 4;
  double balance_after  = 5;
  int64  timestamp      = 6; // unix seconds
  string note           = 7;
}

message HistoryResponse {
  string user_id = 1;
  repeated TransactionRecord transactions = 2;
  int32  count = 3;
}
